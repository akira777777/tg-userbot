name: CI

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/ --cov=control --cov=bot --cov=cloud --cov-report=xml
      - run: python -m ruff check bot.py cloud.py web.py control tests scripts/healthcheck.py
      - run: python -m bandit -q -ll -r bot.py cloud.py web.py control scripts/healthcheck.py
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
        env:
          BOT_TOKEN: test-token
          OWNER_TELEGRAM_IDS: "1"
          CONTROL_SESSION_SECRET: 0123456789abcdef0123456789abcdef
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: test-key

  docker:
    runs-on: ubuntu-latest
    needs: [python, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          tags: tg-userbot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
