# Локальный стек: панель и SQLite. Postgres/Redis/Grafana здесь нет.
# Mini App (worker + controller) — docker-compose.prod.yml, только с реальными
# MINI_APP_URL, OWNER_TELEGRAM_IDS, BOT_TOKEN, CONTROL_SESSION_SECRET (без запасных URL).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-userbot:latest
    container_name: tg-userbot-web
    command: ["web"]
    ports:
      - "8642:8642"
    environment:
      - PYTHONUNBUFFERED=1
      - WEBBOT_HOST=0.0.0.0
      - WEBBOT_PORT=8642
      - USERBOT_DB=/app/data/userbot.db
      - USERBOT_SESSIONS=/app/sessions
      - USERBOT_MEDIA=/app/media_cache
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
    volumes:
      - ./userbot.db:/app/data/userbot.db
      - ./sessions:/app/sessions
      - ./media_cache:/app/media_cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/api/state')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
