# Local control-plane stack. Telegram sessions and SQLite remain on the trusted host volume.
services:
  worker:
    build:
      context: .
      target: prod
    env_file: .env
    command: ["python", "-m", "control.main", "worker"]
    restart: unless-stopped
    volumes:
      - userbot_data:/app/data
      - telegram_sessions:/app/sessions
      - exports:/app/exports

  telegram-controller:
    build:
      context: .
      target: prod
    env_file: .env
    command: ["python", "-m", "control.main", "telegram-bot"]
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_started
    volumes:
      - userbot_data:/app/data
      - telegram_sessions:/app/sessions

volumes:
  userbot_data:
  telegram_sessions:
  exports:
