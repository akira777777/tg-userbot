# docker-compose.yml — оркестрация стека (app + db + redis)
# Версии образов фиксированы для репродуцируемости
# В продакшене используйте docker-compose.prod.yml с autoscaling

services:
  # ───── БАЗА ДАННЫХ (PostgreSQL 16) ─────
  db:
    image: postgres:16-alpine
    container_name: tg-userbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tg_userbot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecret_password_change_me}
      POSTGRES_DB: tg_userbot_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_userbot -d tg_userbot_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ───── REDIS (кеширование, rate-limiting) ─────
  redis:
    image: redis:7-alpine
    container_name: tg-userbot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Control-plane process from the current Dockerfile (python -m control.main).
  app:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    container_name: tg-userbot-app
    restart: unless-stopped
    command: ["python", "-m", "control.main", "healthcheck"]
    environment:
      - TZ=Europe/Moscow
      - BOT_TOKEN=${BOT_TOKEN:-}
      - MINI_APP_URL=${MINI_APP_URL:-https://dashboard.example}
      - OWNER_TELEGRAM_IDS=${OWNER_TELEGRAM_IDS:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - CONTROL_SESSION_SECRET=${CONTROL_SESSION_SECRET:-}
      - WORKER_ID=${WORKER_ID:-worker-1}
    ports:
      - "8741:8741"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tg-userbot-network

  # ───── МЕДИА-БИБЛИОТЕКА (опционально, для хранения файлов) ─────
  media:
    image: alpine:latest
    container_name: tg-userbot-media
    restart: unless-stopped
    volumes:
      - media_storage:/media
    networks:
      - tg-userbot-network

  # ───── MONITORING (Prometheus + Grafana) ─────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tg-userbot-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - tg-userbot-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: tg-userbot-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - tg-userbot-network

  worker:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    container_name: tg-userbot-worker
    restart: unless-stopped
    command: ["python", "-m", "control.main", "worker"]
    environment:
      - TZ=Europe/Moscow
      - BOT_TOKEN=${BOT_TOKEN:-}
      - MINI_APP_URL=${MINI_APP_URL:-https://dashboard.example}
      - OWNER_TELEGRAM_IDS=${OWNER_TELEGRAM_IDS:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - WORKER_ID=${WORKER_ID:-worker-1}
    depends_on:
      - app
    networks:
      - tg-userbot-network

# ==================== NETWORKS & VOLUMES ====================
networks:
  tg-userbot-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  media_storage:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==================== ПРОДАКШЕН (автоскейлинг, без dev-зависимостей) ====================
# docker-compose.prod.yml — отдельный файл для продакшена:
# - без dev-зависимостей
# - с autoscaling (Helm)
# - с мониторингом (Prometheus + Grafana)
# - с логированием (ELK)
