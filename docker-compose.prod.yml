# Mini App + панель. SQLite, без Postgres/Redis.
# Запускать только если в окружении заданы настоящие:
#   BOT_TOKEN, MINI_APP_URL, OWNER_TELEGRAM_IDS, CONTROL_SESSION_SECRET
# Запасных URL и чужих telegram id здесь нет: healthcheck должен падать, пока их нет.

services:
  userbot_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-userbot:latest
    container_name: tg-userbot-worker
    command: ["worker"]
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - BOT_TOKEN=${BOT_TOKEN:?set BOT_TOKEN}
      - MINI_APP_URL=${MINI_APP_URL:?set MINI_APP_URL https}
      - OWNER_TELEGRAM_IDS=${OWNER_TELEGRAM_IDS:?set OWNER_TELEGRAM_IDS}
      - CONTROL_SESSION_SECRET=${CONTROL_SESSION_SECRET:?set CONTROL_SESSION_SECRET}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - USERBOT_DB=/app/data/userbot.db
      - USERBOT_SESSIONS=/app/sessions
      - USERBOT_MEDIA=/app/media_cache
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
    volumes:
      - userbot_sessions:/app/sessions
      - userbot_data:/app/data
      - userbot_media:/app/media_cache
    healthcheck:
      test: ["CMD", "python", "-m", "control.main", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  controller_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-userbot:latest
    container_name: tg-userbot-controller
    command: ["controller"]
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - BOT_TOKEN=${BOT_TOKEN:?set BOT_TOKEN}
      - MINI_APP_URL=${MINI_APP_URL:?set MINI_APP_URL https}
      - OWNER_TELEGRAM_IDS=${OWNER_TELEGRAM_IDS:?set OWNER_TELEGRAM_IDS}
      - CONTROL_SESSION_SECRET=${CONTROL_SESSION_SECRET:?set CONTROL_SESSION_SECRET}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-m", "control.main", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-userbot:latest
    container_name: tg-userbot-web
    command: ["web"]
    ports:
      - "8642:8642"
    environment:
      - PYTHONUNBUFFERED=1
      - WEBBOT_HOST=0.0.0.0
      - WEBBOT_PORT=8642
      - USERBOT_DB=/app/data/userbot.db
      - USERBOT_SESSIONS=/app/sessions
      - USERBOT_MEDIA=/app/media_cache
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
    volumes:
      - userbot_sessions:/app/sessions
      - userbot_data:/app/data
      - userbot_media:/app/media_cache

volumes:
  userbot_sessions:
  userbot_data:
  userbot_media:
