# Production control-plane processes. The dashboard is deployed separately from dashboard/.
services:
  worker:
    image: ${USERBOT_IMAGE:-ghcr.io/novra/tg-userbot:latest}
    env_file: .env
    command: ["python", "-m", "control.main", "worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--db", "/app/data/userbot.db", "--require-control"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - userbot_data:/app/data
      - telegram_sessions:/app/sessions
      - exports:/app/exports

  telegram-controller:
    image: ${USERBOT_IMAGE:-ghcr.io/novra/tg-userbot:latest}
    env_file: .env
    command: ["python", "-m", "control.main", "telegram-bot"]
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    volumes:
      - userbot_data:/app/data
      - telegram_sessions:/app/sessions

volumes:
  userbot_data:
  telegram_sessions:
  exports:
