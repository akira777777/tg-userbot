[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-userbot"
version = "0.2.0"
description = "Telegram Userbot with media library, multi-platform support and dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Novra", email = "novra@example.com"},
]
keywords = ["telegram", "bot", "media", "library", "userbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.9",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.5",
    "supabase>=2.0",
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
    "httpx>=0.28.1",
    "coverage>=7.6.10",
    "ruff>=0.6.9",
    "mypy>=1.14.1",
    "bandit>=1.8.0",
    "black>=25.1.0",
    "pre-commit>=4.1.0",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.12.1",
    "mkdocs-material>=9.6.0",
]

[project.scripts]
tg-userbot = "bot:main"
tg-userbot-cloud = "cloud:main"
tg-userbot-control = "control.main:main"

[project.urls]
"Homepage" = "https://github.com/novra/tg-userbot"
"Documentation" = "https://tg-userbot.novra.dev"
"Source" = "https://github.com/novra/tg-userbot"
"Changelog" = "https://github.com/novra/tg-userbot/releases"

[tool.setuptools]
py-modules = ["bot", "cloud", "web"]

[tool.setuptools.packages.find]
include = ["control*"]

[tool.black]
line-length = 120
target-version = ["py312", "py313"]
include = '\.pyi?$'
exclude = '''
(
  /(
    ^(\.eggs|\.venv|\.git|\.hg|\.mypy_cache|\.pytest|\.tox|\.mypy_cache|\.ruff_cache|__pycache__|dist|build|venv|env)/
  )/
)
'''

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "YTT", "A", "C90", "COM", "EM", "ISC", "ICN", "PTH", "RUF", "SIM", "W", "TRY", "FLY", "ARG", "TCH", "DTZ", "A", "ASYNC", "T10", "RSE", "RUF"]
ignore = ["E501", "RUF012", "COM812", "ISC001", "EM101", "EM102", "TRY003"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "docs/", "scripts/", "build/", "dist/", "dashboard/"]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra -q --strict-markers --cov=control --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["control"]
branch = true
omit = ["*/__init__.py", "*/test_*.py", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.paths]
source = ["control"]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
