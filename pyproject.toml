[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-userbot"
version = "0.2.0"
description = "Telegram userbot: CLI, local panel, optional Mini App control plane"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "telethon>=1.36",
    "aiohttp>=3.9",
    "python-telegram-bot>=21.0",
    "supabase>=2.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
tg-userbot = "bot:main"

[tool.setuptools]
py-modules = ["bot", "web", "cloud"]
packages = ["control"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
addopts = "-ra -q --strict-markers --cov=bot --cov=control --cov-report=term-missing"
testpaths = ["tests", "test_suite.py"]
python_files = ["test_*.py", "test_suite.py"]
asyncio_mode = "auto"
norecursedirs = [".agents", "dashboard", ".venv", "node_modules"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::coverage.exceptions.CoverageWarning",
]

[tool.coverage.run]
source = ["bot", "control"]
branch = true
omit = ["*/test_*.py", "*/conftest.py", "test_api_live.py", "test_media.py"]
