[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-userbot"
version = "0.2.0"
description = "Telegram Userbot with media library, multi-platform support and dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Novra", email = "novra@example.com"},
]
keywords = ["telegram", "bot", "media", "library", "userbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.11.10",
    "aiosqlite>=0.20.0",
    "python-telegram-bot>=20.7",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "sqlalchemy>=2.0.36",
    "supabase>=2.8.1",
    "aiofiles>=24.1.0",
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.32.0",
    "fastapi-cors>=0.2.4",
    "jinja2>=3.1.5",
    "gunicorn>=23.0.0",
    "rich>=13.9.4",
    "python-dateutil>=2.9.0.post0",
    "aio-pika>=9.5.1",
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "faker>=33.1.0",
    "coverage>=7.6.10",
    "ruff>=0.6.9",
    "mypy>=1.14.1",
    "pyright>=1.1.389",
    "bandit>=1.8.0",
    "black>=25.1.0",
    "pre-commit>=4.1.0",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.12.1",
    "mkdocs-material>=9.6.0",
    "mkdocs-jupyter>=0.25.0",
    "mkdocs-include-directive>=1.9.0",
    "mkdocs-redirects>=1.2.2",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autobuild>=2024.10.3",
    "mike>=2.1.3",
    "sphinxcontrib-mermaid>=1.0.0",
]

[project.scripts]
tg-userbot = "tg_userbot.main:main"
tg-userbot-cli = "tg_userbot.cli:main"

[project.urls]
"Homepage" = "https://github.com/novra/tg-userbot"
"Documentation" = "https://tg-userbot.novra.dev"
"Source" = "https://github.com/novra/tg-userbot"
"Changelog" = "https://github.com/novra/tg-userbot/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tg_userbot*"]

[tool.setuptools.package-data]
"tg_userbot" = ["py.typed", "pyproject.toml"]

[tool.black]
line-length = 120
target-version = ["py312", "py313"]
include = '\.pyi?$'
exclude = '''
(
  /(
    ^(\.eggs|\.venv|\.git|\.hg|\.mypy_cache|\.pytest|\.tox|\.mypy_cache|\.ruff_cache|__pycache__|dist|build|venv|env)/
  )/
)
'''

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "YTT", "A", "C90", "COM", "EM", "ISC", "ICN", "PTH", "RUF", "SIM", "W", "TRY", "FLY", "ARG", "TCH", "DTZ", "A", "ASYNC", "T10", "RSE", "RUF"]
ignore = ["E501", "RUF012", "COM812", "ISC001", "EM101", "EM102", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"src/tg_userbot/api/routes/*" = ["ARG", "A003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "docs/", "scripts/", "build/", "dist/"]

[tool.pytest.ini_options]
minversion = "8.3"
pythonpath = ["."]
addopts = "-ra -q --strict-markers --cov=control --cov-report=term-missing"
testpaths = ["tests", "test_suite.py"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::coverage.exceptions.CoverageWarning",
]

[tool.coverage.run]
source = ["control"]
branch = true
omit = ["*/__init__.py", "*/test_*.py", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.paths]
source = ["control"]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
